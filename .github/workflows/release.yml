name: Release

on:
  push:
    tags:
      - "*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      safe-tag: ${{ steps.version.outputs.safe-tag }}
      version-code: ${{ steps.version.outputs.version-code }}
    steps:
      - name: Derive package version from tag
        id: version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          fallback_build=$(( (GITHUB_RUN_NUMBER - 1) % 65535 + 1 ))
          if [[ "$version" =~ ^([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,5})([^0-9]|$) ]] \
            && (( 10#${BASH_REMATCH[1]} <= 255 )) \
            && (( 10#${BASH_REMATCH[2]} <= 255 )) \
            && (( 10#${BASH_REMATCH[3]} <= 65535 )); then
            package_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            package_version="0.0.${fallback_build}"
          fi
          version_code=$(( (GITHUB_RUN_NUMBER - 1) % 2100000000 + 1 ))
          safe_tag="$(printf '%s' "$tag" | sed 's/[^A-Za-z0-9._-]/_/g')"
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"
          echo "safe-tag=$safe_tag" >> "$GITHUB_OUTPUT"
          echo "version-code=$version_code" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Restore Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kcode-release.jks"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kcode-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.package-version }}
          RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version-code }}
        run: >-
          ./gradlew :apps:androidApp:assembleRelease
          -PreleaseVersion="$RELEASE_VERSION"
          -PreleaseVersionCode="$RELEASE_VERSION_CODE"
          --stacktrace
      - name: Verify and stage APK
        shell: bash
        env:
          SAFE_TAG: ${{ needs.metadata.outputs.safe-tag }}
        run: |
          apk="apps/androidApp/build/outputs/apk/release/androidApp-release.apk"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$apk"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          mkdir -p release-assets
          cp "$apk" "release-assets/kcode-${SAFE_TAG}-android.apk"
      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            task: packageMsi
            format: msi
            extension: msi
          - platform: Linux
            runner: ubuntu-latest
            task: packageDeb
            format: deb
            extension: deb
          - platform: macOS
            runner: macos-latest
            task: packageDmg
            format: dmg
            extension: dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot
      - name: Build desktop package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.package-version }}
        run: >-
          ./gradlew :shared:${{ matrix.task }}
          -PreleaseVersion="$RELEASE_VERSION"
          --stacktrace
      - name: Upload desktop package
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.format }}
          path: shared/build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web ZIP
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build web distribution
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.package-version }}
        run: >-
          ./gradlew :shared:wasmJsBrowserDistribution
          -PreleaseVersion="$RELEASE_VERSION"
          --stacktrace
      - name: Package web distribution
        shell: bash
        env:
          SAFE_TAG: ${{ needs.metadata.outputs.safe-tag }}
        run: |
          distribution="shared/build/dist/wasmJs/productionExecutable"
          test -f "$distribution/index.html"
          mkdir -p release-assets
          cd "$distribution"
          zip -r "$GITHUB_WORKSPACE/release-assets/kcode-${SAFE_TAG}-web.zip" .
      - name: Upload web package
        uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs:
      - metadata
      - android
      - desktop
      - web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' packages < <(find release-assets -maxdepth 1 -type f -print0)
          test "${#packages[@]}" -gt 0
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Kcode $GITHUB_REF_NAME"
          fi
